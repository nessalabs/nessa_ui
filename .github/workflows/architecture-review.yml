name: Architecture review

on:
  workflow_run:
    workflows: [Validation]
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  pull-requests: read

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.pull_requests[0].number
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.9.0
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install trusted dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Publish head-bound conformance check
        run: |
          if [ -n "$PR_NUMBER" ]; then
            pnpm verify:pr-architecture -- --repo "${{ github.repository }}" --pr "$PR_NUMBER" --publish-check
          else
            pnpm verify:pr-architecture -- --repo "${{ github.repository }}" --all-open --publish-check
          fi
