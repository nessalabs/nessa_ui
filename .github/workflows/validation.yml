name: Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NESSA_VALIDATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.9.0
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Assert toolchain
        run: |
          test "$(node --version)" = "v20.19.0"
          test "$(pnpm --version)" = "11.9.0"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Provision Chromium
        run: pnpm --filter @nessa-ui/storybook exec playwright install --with-deps chromium
      - name: Run full contract gate
        run: pnpm validate:full
